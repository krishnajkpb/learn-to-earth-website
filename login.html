<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Learn to Earth</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <a class="back" href="index.html">← Learn to Earth</a>
    <div class="brand center"><span class="logo">L</span> Learn to Earth</div>
    <h1>Welcome back</h1>
    <p class="muted">Log in to your learner account.</p>
    <form id="loginForm">
      <label>Email<input id="loginEmail" type="email" required placeholder="you@example.com"></label>
      <label>Password<input id="loginPassword" type="password" required placeholder="Your password"></label>
      <button class="button primary full">Login</button>
    </form>
    <div id="loginMessage" class="message hidden"></div>
    <p class="small">New learner? <a href="signup.html">Create an account</a></p>
    <hr>
    <p class="small"><a href="admin.html">Admin area</a></p>
  </div>
</div>
<script type="module" src="script.js"></script>
</body>
</html>
